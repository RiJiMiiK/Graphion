name: links-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check markdown links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LYCHEE_IMAGE="lycheeverse/lychee:sha-4b588d4"
          for attempt in 1 2 3; do
            if docker pull "${LYCHEE_IMAGE}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Failed to pull ${LYCHEE_IMAGE}" >&2
              exit 1
            fi
            sleep 5
          done
          docker run --rm \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -v "${GITHUB_WORKSPACE}:/input" \
            -w /input \
            "${LYCHEE_IMAGE}" \
            --no-progress \
            --verbose \
            README.md \
            QUALITY.md \
            ROADMAP.md \
            examples/README.md \
            docs/**/*.md \
            CONTRIBUTING.md \
            SECURITY.md
