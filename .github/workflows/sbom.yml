name: sbom-and-vuln-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 18 * * 5"

permissions:
  contents: read
  security-events: write

jobs:
  sbom-scan:
    runs-on: ubuntu-latest
    env:
      SYFT_VERSION: v1.42.3
    steps:
      - uses: actions/checkout@v6

      - name: Generate SBOM (SPDX JSON)
        run: |
          docker pull anchore/syft:${SYFT_VERSION}
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            anchore/syft:${SYFT_VERSION} \
            dir:/work -o spdx-json=sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-spdx-json
          path: sbom.spdx.json
          retention-days: 30

      - name: Vulnerability scan (SARIF)
        uses: anchore/scan-action@v7
        with:
          sbom: sbom.spdx.json
          fail-build: false
          output-format: sarif
          output-file: grype.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: grype.sarif
