name: sbom-and-vuln-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 18 * * 5"

permissions:
  contents: read
  security-events: write

jobs:
  sbom-scan:
    runs-on: ubuntu-latest
    env:
      SYFT_VERSION: v1.42.3
      GRYPE_VERSION: v0.110.0
    steps:
      - uses: actions/checkout@v6

      - name: Generate SBOM (SPDX JSON)
        run: |
          for attempt in 1 2 3; do
            if docker pull anchore/syft:${SYFT_VERSION}; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Failed to pull anchore/syft:${SYFT_VERSION}" >&2
              exit 1
            fi
            sleep 5
          done
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            anchore/syft:${SYFT_VERSION} \
            dir:/work -o spdx-json=sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-spdx-json
          path: sbom.spdx.json
          retention-days: 30

      - name: Vulnerability scan (SARIF)
        run: |
          for attempt in 1 2 3; do
            if docker pull anchore/grype:${GRYPE_VERSION}; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Failed to pull anchore/grype:${GRYPE_VERSION}" >&2
              exit 1
            fi
            sleep 5
          done
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            anchore/grype:${GRYPE_VERSION} \
            sbom:/work/sbom.spdx.json -o sarif > grype.sarif || true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: grype.sarif
