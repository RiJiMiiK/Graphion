documentation:
  - changed-files:
      - any-glob-to-any-file: ["**/*.md", "docs/**"]

language:
  - changed-files:
      - any-glob-to-any-file:
          [
            "src/runtime/interpreter.c",
            "docs/graphion/**",
            "examples/**/*.gion",
            "examples/*.gion",
          ]

runtime:
  - changed-files:
      - any-glob-to-any-file:
          [
            "src/runtime/**",
            "src/vm/**",
            "src/parser/**",
            "src/compiler/**",
          ]

examples:
  - changed-files:
      - any-glob-to-any-file: ["examples/**"]

ci:
  - changed-files:
      - any-glob-to-any-file: [".github/workflows/**", ".github/dependabot.yml"]

tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**", "fuzz/**"]

security:
  - changed-files:
      - any-glob-to-any-file: ["SECURITY.md", "scripts/quality/check_asm_safety.py", ".github/workflows/secrets.yml", ".github/workflows/sbom.yml"]


dependencies:
  - changed-files:
      - any-glob-to-any-file: ["Dockerfile", "docker-compose.yml"]
